name: teplo-prod

services:
  postgres:
    image: postgres:16
    container_name: teplo-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: teplo-api
    restart: always
    env_file:
      - ./.env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../integrations:/app/integrations:ro
    networks:
      - internal

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: teplo-web
    restart: always
    depends_on:
      - api
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: teplo-caddy
    restart: always
    environment:
      TEPLO_DOMAIN: ${TEPLO_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - internal

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
