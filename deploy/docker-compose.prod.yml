name: teplo-prod

services:
  postgres:
    image: postgres:16
    container_name: teplo-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: teplo-api
    restart: always
    env_file:
      - ./.env.prod
      - ./.env.integrations
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../integrations:/app/integrations:ro
      - ./secrets:/run/secrets/teplo:ro
    networks:
      - internal

  scheduler:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: teplo-scheduler
    command: python -m app.scheduler_runner
    healthcheck:
      disable: true
    restart: always
    env_file:
      - ./.env.prod
      - ./.env.integrations
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # Телеграм у этого провайдера доступен НЕ ВЕСЬ: DNS отдаёт 149.154.166.110 (и локальный
    # резолвер, и 1.1.1.1, и 8.8.8.8), а до этого адреса с сервера нет связи — TCP 443 закрыт,
    # опрос бота падал ConnectTimeout каждые полминуты. Адрес 149.154.167.220 из той же сети
    # жив: getMe через него отвечает 200. Пин — самое дешёвое лечение; если однажды закроют и
    # его, контур встанет с тем же явным ConnectTimeout в логах, а не молча.
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../integrations:/app/integrations:ro
      - ./secrets:/run/secrets/teplo:ro
    networks:
      - internal

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: teplo-web
    restart: always
    depends_on:
      - api
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: teplo-caddy
    restart: always
    environment:
      TEPLO_DOMAIN: ${TEPLO_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - internal

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
