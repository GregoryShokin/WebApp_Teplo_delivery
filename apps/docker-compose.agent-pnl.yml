# Изолированный стенд для ревью ОПиУ (слот pnl).
#
# Запуск (из папки apps/ в worktree):
#   docker compose -p teplo-pnl -f docker-compose.agent-pnl.yml up -d
#   docker exec -w /app/apps/api teplo-api-pnl-stand alembic upgrade head
#   docker exec -w /app/apps/api -e PYTHONPATH=/app/apps/api teplo-api-pnl-stand \
#     python -m app.scripts.seed_preview_admin
#
# Вход: admin1@teplo.local / admin-password-for-smoke — единственная учётка превью.
# Порты слота: web 5333, api 8160, postgres 5592.

services:
  postgres:
    image: postgres:16
    container_name: teplo-pg-pnl-stand
    environment:
      POSTGRES_DB: teplo
      POSTGRES_USER: teplo
      POSTGRES_PASSWORD: teplo
    ports:
      - "5592:5432"
    volumes:
      - teplo_pgdata_pnl:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teplo -d teplo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: teplo-api-pnl-stand
    # env_file НЕ подключаем: боевые ключи (Сбер, Т-Банк, Telegram, почта, iiko) на
    # превью не переносим — стенд не должен уметь писать во внешние системы.
    environment:
      DATABASE_URL: postgresql+asyncpg://teplo:teplo@postgres:5432/teplo
      TEPLO_TEST_DATABASE_URL: postgresql+asyncpg://teplo:teplo@postgres:5432/teplo_test_pnl
      ENVIRONMENT: local
      # Фон выключен: стенд не должен ходить во внешние системы и начислять сам.
      SCHEDULER_ENABLED: "false"
      EMPLOYEE_SYNC_ENABLED: "false"
      COUNTERPARTY_INVOICE_SYNC_ENABLED: "false"
      SBIS_SYNC_ENABLED: "false"
      MAIL_POLL_ENABLED: "false"
      TEPLO_BANK_CLIENT_MODE: mock
      # Заглушка iiko обязательна: без переменной IikoClient.__init__ бросает SystemExit,
      # он пробивает обработчики FastAPI и убивает uvicorn — контейнер остаётся «Up», а
      # стенд лежит. С заглушкой запрос честно отдаёт 500. Синк iiko на стенде и не нужен:
      # зеркало заливается копией прод-данных.
      IIKO_SERVER_BASE_URL: http://iiko-disabled.invalid
      TEPLO_ADMIN_EMAIL: admin1@teplo.local
      TEPLO_ADMIN_PASSWORD: admin-password-for-smoke
      JWT_SECRET_KEY: change-me-in-local-env-change-me
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 90
      BACKEND_CORS_ORIGINS: '["http://localhost:5333","http://127.0.0.1:5333"]'
    ports:
      - "8160:8000"
    volumes:
      - ./api:/app/apps/api
      - ../integrations:/app/integrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: teplo-web-pnl-stand
    environment:
      VITE_API_BASE_URL: http://localhost:8160
    ports:
      - "5333:5173"
    volumes:
      - ./web:/app/apps/web
      - /app/apps/web/node_modules
    depends_on:
      - api

volumes:
  teplo_pgdata_pnl:
