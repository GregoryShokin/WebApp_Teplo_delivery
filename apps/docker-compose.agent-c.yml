# Изолированный стек агента agent-c (слот 3): свой Docker-проект, контейнеры, порты и БД.
# Порты слота 3: web 5203 / api 8030 / pg 5462 (формула: web 5173+10k, api 8000+10k, pg 5432+10k).
# Не пересекается с default (5173/8000/5432), agent-b (5183/8010/5442),
# agent-periods (5193/8020/5452), agent-dds (5233/8060/5492), preview-ic (5243/8070/5502).
#
# Запуск (из папки apps/ в worktree агента):
#   docker compose -p teplo-c -f docker-compose.agent-c.yml up -d
#   docker exec -w /app/apps/api teplo-api-c alembic upgrade head
#
# Default-стек первого агента (docker compose up) продолжает жить параллельно.

services:
  postgres:
    image: postgres:16
    container_name: teplo-postgres-c
    environment:
      POSTGRES_DB: teplo
      POSTGRES_USER: teplo
      POSTGRES_PASSWORD: teplo
    ports:
      - "5462:5432"
    volumes:
      - teplo_pgdata_c:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teplo -d teplo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: teplo-api-c
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://teplo:teplo@postgres:5432/teplo
      TEPLO_TEST_DATABASE_URL: postgresql+asyncpg://teplo:teplo@postgres:5432/teplo_test_c
      # В ../.env лежит live-режим с боевыми кредами: без этой строки стенд выпишет
      # настоящий платёж в T-Bank. environment перебивает env_file — не убирать.
      TEPLO_BANK_CLIENT_MODE: mock
      # Заглушка iiko: без переменной IikoClient.__init__ бросает SystemExit и роняет uvicorn
      # (один заход на «График» кладёт весь стенд). С заглушкой запрос честно отдаёт 500.
      IIKO_SERVER_BASE_URL: http://iiko-disabled.invalid
      TEPLO_ADMIN_EMAIL: admin1@teplo.local
      TEPLO_ADMIN_PASSWORD: admin-password-for-smoke
      JWT_SECRET_KEY: change-me-in-local-env-change-me
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 90
      BACKEND_CORS_ORIGINS: '["http://localhost:5203","http://127.0.0.1:5203"]'
    ports:
      - "8030:8000"
    volumes:
      - ./api:/app/apps/api
      - ../integrations:/app/integrations:ro
      - ../research/scripts:/app/research/scripts:ro
      - ../research/raw:/app/research/raw
      - ../research/processed:/app/research/processed
      - ../research/private:/app/research/private
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: teplo-web-c
    environment:
      VITE_API_BASE_URL: http://localhost:8030
    ports:
      - "5203:5173"
    volumes:
      - ./web:/app/apps/web
      - /app/apps/web/node_modules
    depends_on:
      - api

volumes:
  teplo_pgdata_c:
