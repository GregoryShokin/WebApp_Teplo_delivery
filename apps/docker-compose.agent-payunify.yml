# Изолированный стек агента payunify (слот 10): свой проект/порты/БД.
# Задача: слияние «Платежи» + «Страница на оплату», разбор контрагентов из ЭДО СБИС.
# Порты слота 10: web 5273 / api 8100 / pg 5532 (формула: web 5173+10k, api 8000+10k, pg 5432+10k).
# Не пересекается с default (5173/8000/5432), agent-b (5183/8010/5442),
# agent-periods (5193/8020/5452), agent-c (5203/8030/5462), payments (7153/8040/5472),
# partial (7163/8050/5482), agent-dds (5233/8060/5492), preview-ic (5243/8070/5502),
# preview-svcledger (5263/8090/5522), dzkz (pg 5512).
#
# Запуск (из apps/ в этом worktree):
#   docker compose -p teplo-payunify -f docker-compose.agent-payunify.yml up -d postgres
#   docker compose -p teplo-payunify -f docker-compose.agent-payunify.yml up -d        # + api/web
#   docker exec -w /app/apps/api teplo-api-payunify alembic upgrade head
#   docker exec -w /app/apps/api -e PYTHONPATH=/app/apps/api teplo-api-payunify \
#     python -m app.scripts.seed_preview_admin
#
# Тесты — СТРОГО в свою базу teplo_test_payunify (общая teplo_test = снос схемы соседу):
#   docker exec -w /app/apps/api teplo-api-payunify pytest -q
services:
  postgres:
    image: postgres:16
    container_name: teplo-postgres-payunify
    environment:
      POSTGRES_DB: teplo
      POSTGRES_USER: teplo
      POSTGRES_PASSWORD: teplo
    ports:
      - "5532:5432"
    volumes:
      - teplo_pgdata_payunify:/var/lib/postgresql/data
    # fsync=off — тестовая БД одноразовая, а с fsync прогон идёт десятки минут вместо секунд.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "max_connections=800"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teplo -d teplo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: teplo-api-payunify
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://teplo:teplo@postgres:5432/teplo
      TEPLO_TEST_DATABASE_URL: postgresql+asyncpg://teplo:teplo@postgres:5432/teplo_test_payunify
      # В ../.env лежит live-режим с боевыми кредами: без этой строки стенд выпишет
      # настоящий платёж в T-Bank. environment перебивает env_file — не убирать.
      TEPLO_BANK_CLIENT_MODE: mock
      # Заглушка iiko: без переменной IikoClient.__init__ бросает SystemExit и роняет uvicorn
      # (один заход на «График» кладёт весь стенд). С заглушкой запрос честно отдаёт 500.
      IIKO_SERVER_BASE_URL: http://iiko-disabled.invalid
      ENVIRONMENT: local
      SCHEDULER_ENABLED: "false"
      EMPLOYEE_SYNC_ENABLED: "false"
      COUNTERPARTY_INVOICE_SYNC_ENABLED: "false"
      SBIS_SYNC_ENABLED: "false"
      MAIL_POLL_ENABLED: "false"
      TEPLO_ADMIN_EMAIL: admin1@teplo.local
      TEPLO_ADMIN_PASSWORD: admin-password-for-smoke
      JWT_SECRET_KEY: change-me-in-local-env-change-me
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 90
      BACKEND_CORS_ORIGINS: '["http://localhost:5273","http://127.0.0.1:5273"]'
    ports:
      - "8100:8000"
    volumes:
      - ./api:/app/apps/api
      - ../integrations:/app/integrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: teplo-web-payunify
    environment:
      VITE_API_BASE_URL: http://localhost:8100
    ports:
      - "5273:5173"
    volumes:
      - ./web:/app/apps/web
      - /app/apps/web/node_modules
    depends_on:
      - api

volumes:
  teplo_pgdata_payunify:
