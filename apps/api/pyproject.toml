[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teplo-api"
version = "0.1.0"
description = "FastAPI backend for the Teplo management accounting app."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "anthropic>=0.39.0",
  "apscheduler>=3.10.4",
  "asyncpg>=0.29.0",
  "bcrypt>=4.1.3",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "openpyxl>=3.1.0",
  "pydantic-settings>=2.3.0",
  "pyjwt>=2.8.0",
  # Разбор multipart/form-data. Нужен для загрузки коммунальных платёжек: до неё файлов
  # приложение не принимало вовсе. Без пакета FastAPI роняет ПРИЛОЖЕНИЕ НА СТАРТЕ, как только
  # в роуте появляется UploadFile, — то есть выкатка требует пересборки образа, а не только
  # обновления кода.
  "python-multipart>=0.0.9",
  # Чтение HEIC — формата, в котором айфон снимает по умолчанию. Ни браузер (кроме Safari), ни
  # vision-распознавание его не принимают, поэтому снимок конвертируется в JPEG. Колёса
  # pillow-heif несут libheif внутри, системных пакетов в образ ставить не нужно.
  "pillow-heif>=0.16",
  "pypdf>=4.2.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "uvicorn[standard]>=0.30.0",
  "xlrd>=2.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
