# Изолированный стек агента dds-payroll (слот 3): свой проект/порты/БД.
# Не пересекается с default (5432/8000/5173), agent-b (5442/8010/5183), agent-c (5452/8020/5193).
#
# Запуск (из apps/ в этом worktree):
#   docker compose -p teplo-dds -f docker-compose.agent-dds.yml up -d postgres
#   docker compose -p teplo-dds -f docker-compose.agent-dds.yml up -d        # + api/web
#   docker exec -w /app/apps/api teplo-api-dds alembic upgrade head
services:
  postgres:
    image: postgres:16
    container_name: teplo-postgres-dds
    environment:
      POSTGRES_DB: teplo
      POSTGRES_USER: teplo
      POSTGRES_PASSWORD: teplo
    ports:
      - "5462:5432"
    volumes:
      - teplo_pgdata_dds:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teplo -d teplo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: teplo-api-dds
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://teplo:teplo@postgres:5432/teplo
      TEPLO_TEST_DATABASE_URL: postgresql+asyncpg://teplo:teplo@postgres:5432/teplo_test_dds
      TEPLO_ADMIN_EMAIL: admin1@teplo.local
      TEPLO_ADMIN_PASSWORD: admin-password-for-smoke
      JWT_SECRET_KEY: change-me-in-local-env-change-me
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 90
      BACKEND_CORS_ORIGINS: '["http://localhost:5203","http://127.0.0.1:5203"]'
    ports:
      - "8030:8000"
    volumes:
      - ./api:/app/apps/api
      - ../integrations:/app/integrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: teplo-web-dds
    environment:
      VITE_API_BASE_URL: http://localhost:8030
    ports:
      - "5203:5173"
    volumes:
      - ./web:/app/apps/web
      - /app/apps/web/node_modules
    depends_on:
      - api

volumes:
  teplo_pgdata_dds:
