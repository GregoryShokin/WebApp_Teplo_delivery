server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PDF.js module worker must be served as JavaScript (stock mime.types omits .mjs).
    location ~ ^/assets/.*\.mjs$ {
        try_files $uri =404;
        default_type application/javascript;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Long cache for static assets with hashed filenames.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every non-asset path serves index.html so client-side
    # routing keeps working on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
