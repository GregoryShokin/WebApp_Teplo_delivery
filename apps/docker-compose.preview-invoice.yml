services:
  postgres:
    image: postgres:16
    container_name: teplo-postgres-invoice
    environment:
      POSTGRES_DB: teplo
      POSTGRES_USER: teplo
      POSTGRES_PASSWORD: teplo
    ports: ["5512:5432"]
    volumes: ["teplo_pgdata_invoice:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teplo -d teplo"]
      interval: 3s
      timeout: 5s
      retries: 20
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: teplo-api-invoice
    environment:
      DATABASE_URL: postgresql+asyncpg://teplo:teplo@postgres:5432/teplo
      ENVIRONMENT: local
      SCHEDULER_ENABLED: "false"
      EMPLOYEE_SYNC_ENABLED: "false"
      COUNTERPARTY_INVOICE_SYNC_ENABLED: "false"
      SBIS_SYNC_ENABLED: "false"
      MAIL_POLL_ENABLED: "false"
      TEPLO_BANK_CLIENT_MODE: mock
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: https://api.anthropic.com
      INVOICE_REVIEW_EXTERNAL_LLM_ENABLED: ${INVOICE_REVIEW_EXTERNAL_LLM_ENABLED:-false}
      INVOICE_REVIEW_LLM_BASE_URL: https://api.anthropic.com
      IIKO_SERVER_BASE_URL: http://iiko-disabled.invalid
      JWT_SECRET_KEY: invoice-preview-local-secret-change-me
      BACKEND_CORS_ORIGINS: '["http://localhost:5253","http://127.0.0.1:5253"]'
    ports: ["8080:8000"]
    volumes: ["./api:/app/apps/api"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  teplo_pgdata_invoice:
