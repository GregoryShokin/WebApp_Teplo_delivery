# Изолированный стек агента counterparty-service-periods (слот 2): свой проект/порты/БД.
# Порты слота 2: web 5193 / api 8020 / pg 5452 (формула: web 5173+10k, api 8000+10k, pg 5432+10k).
# Не пересекается с default (5173/8000/5432), agent-b (5183/8010/5442),
# agent-c (5203/8030/5462), payments (7153/8040/5472), partial (7163/8050/5482),
# agent-dds (5233/8060/5492), preview-ic (5243/8070/5502).
#
# Запуск (из apps/ в этом worktree):
#   docker compose -p teplo-periods -f docker-compose.agent-periods.yml up -d postgres
#   docker compose -p teplo-periods -f docker-compose.agent-periods.yml up -d        # + api/web
#   docker exec -w /app/apps/api teplo-api-periods alembic upgrade head
#
# Превью: web http://localhost:5193, api http://localhost:8020/docs
services:
  postgres:
    image: postgres:16
    container_name: teplo-postgres-periods
    environment:
      POSTGRES_DB: teplo
      POSTGRES_USER: teplo
      POSTGRES_PASSWORD: teplo
    ports:
      - "5452:5432"
    volumes:
      - teplo_pgdata_periods:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teplo -d teplo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: teplo-api-periods
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://teplo:teplo@postgres:5432/teplo
      TEPLO_TEST_DATABASE_URL: postgresql+asyncpg://teplo:teplo@postgres:5432/teplo_test_periods
      TEPLO_ADMIN_EMAIL: admin1@teplo.local
      TEPLO_ADMIN_PASSWORD: admin-password-for-smoke
      TEPLO_BANK_CLIENT_MODE: mock
      JWT_SECRET_KEY: change-me-in-local-env-change-me
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 90
      BACKEND_CORS_ORIGINS: '["http://localhost:5193","http://127.0.0.1:5193"]'
    ports:
      - "8020:8000"
    volumes:
      - ./api:/app/apps/api
      - ../integrations:/app/integrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: teplo-web-periods
    environment:
      VITE_API_BASE_URL: http://localhost:8020
    ports:
      - "5193:5173"
    volumes:
      - ./web:/app/apps/web
      - /app/apps/web/node_modules
    depends_on:
      - api

volumes:
  teplo_pgdata_periods:
